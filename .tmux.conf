# =====================================
# General Settings
# =====================================
set -g mouse on

# =====================================
# Prefix Key
# =====================================
unbind C-b
set -g prefix `
bind ` send-prefix

# =====================================
# Copy Mode / Scrolling
# =====================================
bind -T copy-mode-vi WheelUpPane   send -N5 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N5 -X scroll-down

# =====================================
# Pane Management
# =====================================
bind -n C-t split-window -h -c "#{pane_current_path}"
bind -n C-y split-window -v -c "#{pane_current_path}"
bind -n C-x kill-pane

# Copy mouse selection to system clipboard (macOS)
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Extended Key Support
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
